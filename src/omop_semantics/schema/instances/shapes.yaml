shapes:
  - name: presence
    version: "1"
    roles: [concept]
    rows:
      - id: observation
        profile: observation_simple
        concept: {role: concept}
        value: {kind: presence}

  - name: criteria_gate_condition
    version: "1"
    roles: [concept, answer]
    code_groups: [yes, no]
    rows:
      - id: condition
        profile: condition_simple
        concept: {role: concept}
        constraints:
          - {kind: domain, reference: Condition}
        value: {kind: presence}
        suppress_when:
          source: {role: answer}
          test: in
          codes_from: [no]
        special_values:
          - source: {role: answer}
            when: {source: {role: answer}, test: unanswered}
            mode: drop
            reason: missing
          - source: {role: answer}
            when: {source: {role: answer}, test: not_in, codes_from: [yes, no]}
            mode: fail
            reason: mapping_failed

  - name: yes_no_observation
    version: "1"
    roles: [concept, answer]
    code_groups: [yes, no]
    rows:
      - id: observation
        profile: observation_coded
        concept: {role: concept}
        value:
          kind: coded
          source: {role: answer}
          mapping:
            binding_codes:
              - {codes_from: yes, concept: observations.yes_no_answers.yes}
              - {codes_from: no, concept: observations.yes_no_answers.no}

  - name: coded_measurement
    version: "1"
    roles: [concept, value]
    rows:
      - id: measurement
        profile: measurement_coded
        concept: {role: concept}
        value: {kind: coded, source: {role: value}}

  - name: numeric_measurement
    version: "1"
    roles: [concept, value]
    rows:
      - id: measurement
        profile: measurement_numeric
        concept: {role: concept}
        value: {kind: numeric, source: {role: value}}

  - name: numeric_measurement_with_context_unit
    version: "1"
    roles: [concept, value]
    context: [unit]
    rows:
      - id: measurement
        profile: measurement_numeric_with_unit
        concept: {role: concept}
        value:
          kind: numeric_with_unit
          source: {role: value}
          unit: {source: {context: unit}}

  - name: numeric_measurement_with_operator
    version: "1"
    roles: [concept, value, operator]
    context: [unit, range_low, range_high]
    optional_context: [range_low, range_high]
    rows:
      - id: measurement
        profile: measurement_numeric_with_operator
        concept: {role: concept}
        value:
          kind: numeric_with_unit
          source: {role: value}
          unit: {source: {context: unit}}
          operator: {role: operator}
          range_low: {context: range_low}
          range_high: {context: range_high}

  - name: partial_date_observation
    version: "1"
    roles: [concept, year, month, day]
    optional_roles: [month, day]
    rows:
      - id: observation
        profile: observation_string
        concept: {role: concept}
        value:
          kind: partial_date
          year: {role: year}
          month: {role: month}
          day: {role: day}

  - name: condition_with_status_role
    version: "1"
    roles: [concept, status]
    optional_roles: [status]
    rows:
      - id: condition
        profile: condition_with_status
        concept: {role: concept}
        constraints:
          - {kind: domain, reference: Condition}
        value: {kind: presence}
        derivations:
          - target_slot: condition_status_concept_id
            source: {role: status}
            mapping: {registry_labels: condition_modifiers.condition_status}
