id: https://example.org/omop_semantic_registry/profile_groups
name: omop_profile_groups
title: OMOP Semantic Registry – Profile Groups
description: >
  Registry groupings of valid OMOP CDM projection profiles by table.

imports:
  - omop_semantic_registry.yaml

ObservationProfiles:
  class_uri: RegistryGroup
  name: ObservationProfiles
  role: cdm_profile_set
  members:
    - observation_simple
    - observation_coded
    - observation_string
    - observation_numeric
    - observation_numeric_with_unit
    - observation_with_qualifier
  notes: Valid CDM projection profiles for the OMOP OBSERVATION table


MeasurementProfiles:
  class_uri: RegistryGroup
  name: MeasurementProfiles
  role: cdm_profile_set
  members:
    - measurement_numeric
    - measurement_numeric_with_unit
    - measurement_numeric_with_operator
    - measurement_coded
    - measurement_simple
  notes: Valid CDM projection profiles for the OMOP MEASUREMENT table


ProcedureProfiles:
  class_uri: RegistryGroup
  name: ProcedureProfiles
  role: cdm_profile_set
  members:
    - procedure_simple
    - procedure_with_inline_modifier


ConditionProfiles:
  class_uri: RegistryGroup
  name: ConditionProfiles
  role: cdm_profile_set
  members:
    - condition_simple
    - condition_with_status


DrugExposureProfiles:
  class_uri: RegistryGroup
  name: DrugExposureProfiles
  role: cdm_profile_set
  members:
    - drug_exposure_simple
    - drug_exposure_dose
    - drug_exposure_with_quantity_and_days_supply
    - drug_exposure_with_route


DeviceProfiles:
  class_uri: RegistryGroup
  name: DeviceProfiles
  role: cdm_profile_set
  members:
    - device_simple


VisitProfiles:
  class_uri: RegistryGroup
  name: VisitProfiles
  role: cdm_profile_set
  members:
    - visit_simple


DeathProfiles:
  class_uri: RegistryGroup
  name: DeathProfiles
  role: cdm_profile_set
  members:
    - death_simple


SpecimenProfiles:
  class_uri: RegistryGroup
  name: SpecimenProfiles
  role: cdm_profile_set
  members:
    - specimen_simple
    - specimen_with_site_status_quantity
