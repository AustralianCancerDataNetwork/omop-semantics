shapes:
  - name: histological_grade_value
    version: "1"
    roles: [concept, answer]
    rows:
      - id: measurement
        profile: measurement_coded
        concept: {role: concept}
        value:
          kind: ordinal
          source: {role: answer}
          mapping: {registry_labels: condition_modifiers.tumor_grade}
          order:
            - condition_modifiers.tumor_grade.grade_1
            - condition_modifiers.tumor_grade.grade_2
            - condition_modifiers.tumor_grade.grade_3
            - condition_modifiers.tumor_grade.grade_4

  - name: score_from_code
    version: "1"
    roles: [concept, score]
    rows:
      - id: measurement
        profile: measurement_numeric
        concept: {role: concept}
        value:
          kind: numeric_from_code
          source: {role: score}
          mapping:
            code_map:
              - {code: absent, number: 0}
              - {code: mild, number: 1}

  - name: measurement_with_converted_unit
    version: "1"
    roles: [concept, value, operator]
    context: [unit, range_low, range_high]
    rows:
      - id: measurement
        profile: measurement_numeric_with_operator
        concept: {role: concept}
        value:
          kind: numeric_with_unit
          source: {role: value}
          unit:
            source: {context: unit}
            allowed: measurements_numeric.body_size_units
            canonical: measurements_numeric.body_size_units.kg
            conversions:
              - {unit: measurements_numeric.body_size_units.lb, factor: 0.45359237}
          operator: {role: operator}
          range_low: {context: range_low}
          range_high: {context: range_high}

  - name: related_rows
    version: "2"
    roles: [condition, measurement, observation, related, modifier]
    context: [form_date, visit_date, use_form_date, visit, status, link_external]
    rows:
      - id: condition
        profile: condition_with_status
        concept: {role: condition}
        value: {kind: presence}
        constraints:
          - {kind: domain, reference: Condition}
          - {kind: standard_only}
        context:
          event_date:
            - source: {context: form_date}
              when: {source: {context: use_form_date}, test: in, codes: ["true"]}
            - source: {context: visit_date}
          visit: {context: visit}
        derivations:
          - target_slot: condition_status_concept_id
            source: {context: status}
            mapping: {external_map: diagnosis-status}
            when: {source: {context: status}, test: answered}
      - id: measurement
        profile: measurement_numeric
        concept: {role: measurement}
        value: {kind: numeric, source: {role: modifier}}
      - id: observation
        profile: observation_coded
        concept: {role: observation}
        value: {kind: coded, source: {role: modifier}}
    links:
      - source_row: measurement
        target_row: condition
        mechanism: measurement
      - source_row: observation
        target_item: {role: related}
        target_table: condition_occurrence
        mechanism: observation
        when: {source: {context: link_external}, test: in, codes: ["true"]}

  - name: observation_with_unknown
    version: "1"
    roles: [concept, answer]
    rows:
      - id: observation
        profile: observation_coded
        concept: {role: concept}
        value:
          kind: coded
          source: {role: answer}
          mapping: {registry_labels: observations.yes_no_answers}
        special_values:
          - source: {role: answer}
            when: {source: {role: answer}, test: in, codes: ["declined"]}
            mode: keep_as_value
            reason: asked_declined
            unknown: generic

  - name: visit_with_care_site
    version: "1"
    roles: [concept]
    context: [care_site]
    rows:
      - id: visit
        profile: visit_simple
        concept: {role: concept}
        value: {kind: presence}
        context:
          care_site: {context: care_site}

  - name: anchor_filter
    version: "1"
    roles: [concept]
    rows:
      - id: modifier
        profile: condition_simple
        concept: {role: concept}
        value: {kind: presence}
        constraints:
          - {kind: descendants, reference: condition_modifiers.metastatic_disease_concepts}
