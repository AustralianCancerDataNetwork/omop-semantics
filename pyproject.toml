[project]
name = "omop-semantics"
version = "0.4.0"
description = "Define, validate, and use schema-backed semantic conventions for OMOP CDM"
readme = "README.md"
authors = [
    { name = "gkennos", email = "georgina.kennedy@unsw.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "linkml>=1.11.1",
    "linkml-runtime>=1.11.1",
    "python-dotenv>=1.2.2",
    "ruamel-yaml>=0.18.17",
    "typing-extensions>=4.15.0",
    "urllib3>=2.7.0"
]

[project.scripts]
omop-semantics = "omop_semantics:main"

[project.optional-dependencies]
dev = [
  "ipython>=8.0",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "rich>=13.0",
  "textual>=0.60",
  "tornado>=6.5.7",
  "pygments>=2.20.0"
]
tui = [
  "textual>=0.60",
]
docs = [
  "mkdocs-material>=9.7.6",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "pygments>=2.20.0"
]
[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
ignore = ["src/omop_semantics/schema/generated_models"]

[project.urls]
Homepage = "https://australiancancerdatanetwork.github.io/omop-semantics/"
Repository = "https://github.com/AustralianCancerDataNetwork/omop-semantics"
Issues = "https://github.com/AustralianCancerDataNetwork/omop-semantics/issues"
